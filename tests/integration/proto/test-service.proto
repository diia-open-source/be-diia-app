syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "schema-reflection-test.proto";

package ua.gov.diia.test;

option java_multiple_files = true;
option java_package = "ua.gov.diia.test";

service Test {
  rpc GetTest(GetTestReq) returns (GetTestRes) {};
  rpc GetTestWithCtx(GetTestReq) returns (GetTestRes) {};
  rpc ThrowError(ThrowErrorReq) returns (GetTestRes) {};
  rpc LockResource(LockResourceReq) returns (GetTestRes) {};
  rpc TryLockResource(LockResourceReq) returns (GetTestRes) {};
  rpc EchoParams(EchoParamsReq) returns (EchoParamsRes) {};
  rpc EchoContext(EchoContextReq) returns (EchoContextRes) {};
  rpc EchoTypedParams(TypedParams) returns (TypedParams) {};
  rpc EchoTimestamp(EchoTimestampReq) returns (EchoTimestampRes) {};
  rpc GetVersioned(GetTestReq) returns (GetVersionedRes) {};
  rpc SubscribeTest(SubscribeTestReq) returns (stream TestEvent) {};
  rpc ChatTest(stream TestEvent) returns (stream TestEvent) {};
}

service TestPrivate {
  rpc GetTestPrivate(GetTestReq) returns (GetTestRes) {};
}

message GetTestReq {
  int32 timeoutMs = 1;
}

message GetTestRes {
  string status = 1;
}

message ThrowErrorReq { 
  message ErrorData {
    optional string description = 2;
  }

  int32 httpStatus = 1;
  optional int32 processCode = 2;
  optional ErrorData data = 3;
  optional string type = 4; 
}

message LockResourceReq {
  string id = 1;
}

message EchoParamsReq {
  string name = 1;
  optional string nickname = 2;
  optional EchoNestedMsg nested = 3;
  repeated EchoNestedMsg items = 4;
  EchoNestedMsg plain = 5;
}

message EchoNestedMsg {
  string value = 1;
  optional string extra = 2;
  optional EchoDeeplyNestedMsg deep = 3;
}

message EchoDeeplyNestedMsg {
  string id = 1;
  optional string label = 2;
}

message EchoParamsRes {
  string paramsJson = 1;
}

message EchoContextReq {}

message EchoContextRes {
  string headersJson = 1;
  string sessionJson = 2;
}

message TypedParams {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_A = 1;
    KIND_B = 2;
  }

  message Inner {
    Kind kind = 1;
    string value = 2;
  }

  message Pair {
    string key = 1;
    string value = 2;
  }

  Kind kind = 1;
  repeated Kind kinds = 2;
  Inner inner = 3;
  repeated Inner inners = 4;
  map<string, string> labels = 5;
  map<string, Inner> innerByKey = 6;
  int32 count = 7;
  int64 big = 8;
  bool flag = 9;
  google.protobuf.Timestamp at = 10;
  ua.gov.diia.test.schema.UserStatus userStatus = 11;
  repeated Pair pairs = 12;
  map<string, Kind> kindByKey = 13;
  repeated int32 nums = 14;
}

message Envelope {
  message Entry {
    EchoNestedMsg item = 1;
  }

  repeated Entry entries = 1;
}

message EchoTimestampReq {
  google.protobuf.Timestamp at = 1;
  string shape = 2;
}

message EchoTimestampRes {
  google.protobuf.Timestamp at = 1;
  string receivedAs = 2;
}

message GetVersionedRes {
  string version = 1;
}

message SubscribeTestReq {
  string id = 1;
  optional string mode = 2;
}

message TestEvent {
  string id = 1;
  string payload = 2;
  optional string error = 3;
}
